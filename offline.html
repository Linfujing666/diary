<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#5a8a4a">
<title>富婆的财富日记 · 离线</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #5a8a4a 0%, #3d6b34 100%);
    color: #fff;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    text-align: center;
  }
  .coin {
    width: 96px;
    height: 96px;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #f0d782, #d4a25e);
    box-shadow: 0 4px 16px rgba(0,0,0,0.2);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 56px;
    font-weight: 700;
    color: #3a3a32;
    margin-bottom: 24px;
  }
  h1 { font-size: 22px; font-weight: 600; margin-bottom: 8px; }
  p { font-size: 14px; opacity: 0.85; line-height: 1.7; max-width: 280px; margin-bottom: 24px; }
  button {
    background: rgba(255,255,255,0.18);
    color: #fff;
    border: 1.5px solid rgba(255,255,255,0.4);
    padding: 12px 32px;
    border-radius: 12px;
    font-size: 15px;
    cursor: pointer;
    backdrop-filter: blur(8px);
  }
  button:active { background: rgba(255,255,255,0.28); }
  .leaves {
    position: fixed;
    pointer-events: none;
    opacity: 0.3;
  }
  .leaf { position: absolute; font-size: 20px; }
  .leaf-1 { top: 10%; left: 8%; transform: rotate(-20deg); }
  .leaf-2 { top: 18%; right: 12%; transform: rotate(35deg); }
  .leaf-3 { bottom: 22%; left: 12%; transform: rotate(15deg); }
  .leaf-4 { bottom: 12%; right: 10%; transform: rotate(-30deg); }
</style>
</head>
<body>
  <div class="leaves">
    <div class="leaf leaf-1">🌿</div>
    <div class="leaf leaf-2">🍃</div>
    <div class="leaf leaf-3">🌿</div>
    <div class="leaf leaf-4">🍃</div>
  </div>
  <div class="coin">¥</div>
  <h1>网络好像断开了 🌱</h1>
  <p>可能是网络问题，但你之前的数据都好好保存在本地呢。<br>恢复连接后会自动同步。</p>
  <button onclick="location.reload()">重新连接</button>
</body>
</html>
