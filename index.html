<script src="data.js"></script>

<script>
// =============== PWA 核心：Service Worker + 安装引导 ===============
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js')
      .then(reg => {
        // 监听更新
        reg.addEventListener('updatefound', () => {
          const newWorker = reg.installing;
          if (!newWorker) return;
          newWorker.addEventListener('statechange', () => {
            if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
              console.log('[PWA] 新版本可用，请刷新');
              if (window.App && App.toast) {
                App.toast('新版本已就绪，刷新即可使用 ✨');
              }
            }
          });
        });
        console.log('[PWA] Service Worker 注册成功');
      })
      .catch(err => console.log('[PWA] SW注册失败:', err));
  });
}

// =============== 安装横幅引导 ===============
let deferredInstallPrompt = null;
const isStandalone = window.matchMedia('(display-mode: standalone)').matches
                   || window.navigator.standalone === true;
const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
const isDismissed = sessionStorage.getItem('install-dismissed');

window.addEventListener('beforeinstallprompt', (e) => {
  // 阻止 Chrome 默认的安装弹窗
  e.preventDefault();
  deferredInstallPrompt = e;
  // 已经在用 PWA 或已关闭 → 不显示
  if (isStandalone || isDismissed) return;
  // 显示自定义安装横幅
  setTimeout(() => {
    const banner = document.getElementById('install-banner');
    if (banner) banner.style.display = 'flex';
  }, 3000); // 延迟 3 秒，等用户先看一眼应用
});

window.addEventListener('appinstalled', () => {
  console.log('[PWA] 应用已安装');
  deferredInstallPrompt = null;
  const banner = document.getElementById('install-banner');
  if (banner) banner.style.display = 'none';
});

// 安装按钮
document.addEventListener('DOMContentLoaded', () => {
  const installBtn = document.getElementById('install-btn');
  const installClose = document.getElementById('install-close');
  const iosHintClose = document.getElementById('ios-hint-close');

  if (installBtn) {
    installBtn.addEventListener('click', async () => {
      if (!deferredInstallPrompt) return;
      deferredInstallPrompt.prompt();
      const { outcome } = await deferredInstallPrompt.userChoice;
      if (outcome === 'accepted') {
        console.log('[PWA] 用户接受安装');
      }
      deferredInstallPrompt = null;
      const banner = document.getElementById('install-banner');
      if (banner) banner.style.display = 'none';
    });
  }
  if (installClose) {
    installClose.addEventListener('click', () => {
      sessionStorage.setItem('install-dismissed', '1');
      const banner = document.getElementById('install-banner');
      if (banner) banner.style.display = 'none';
    });
  }
  if (iosHintClose) {
    iosHintClose.addEventListener('click', () => {
      sessionStorage.setItem('install-dismissed', '1');
      const hint = document.getElementById('ios-install-hint');
      if (hint) hint.style.display = 'none';
    });
  }
  // iOS 用户特殊引导（Safari 不支持 beforeinstallprompt）
  if (isIOS && !isStandalone && !isDismissed) {
    setTimeout(() => {
      // 检查是否已显示过
      if (!sessionStorage.getItem('ios-hint-shown')) {
        const hint = document.getElementById('ios-install-hint');
        if (hint) {
          hint.style.display = 'flex';
          sessionStorage.setItem('ios-hint-shown', '1');
        }
      }
    }, 5000);
  }
});
</script>
